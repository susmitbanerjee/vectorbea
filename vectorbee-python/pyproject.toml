[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vectorbee"
version = "0.1.0"
description = "Python SDK for the vectorbee local UDS proxy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.68,<2.0",
    "protobuf>=4.25,<6.0",
    "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
# Used only for regenerating *_pb2.py / *_pb2_grpc.py from vectorbee.proto.
# Runtime users do not need this — only SDK maintainers.
codegen = [
    "grpcio-tools>=1.68,<2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
