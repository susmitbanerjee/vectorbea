services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: vectorbee-e2e-db
    environment:
      POSTGRES_USER: vectorbee
      POSTGRES_PASSWORD: vectorbee
      POSTGRES_DB: vectorbee_test
    volumes:
      - ./vectorbee-backend/supabase/migrations/20260405_000001_mvp_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./vectorbee-backend/supabase/migrations/20260405_000002_prompt_publish_status.sql:/docker-entrypoint-initdb.d/02-prompt-publish-status.sql:ro
      - ./vectorbee-backend/supabase/migrations/20260408_000001_audit_split_latency.sql:/docker-entrypoint-initdb.d/03-audit-split-latency.sql:ro
      - ./vectorbee-backend/supabase/migrations/20260408_000002_api_key_last_four.sql:/docker-entrypoint-initdb.d/04-api-key-last-four.sql:ro
      - ./vectorbee-backend/supabase/migrations/20260409_000001_api_key_name.sql:/docker-entrypoint-initdb.d/05-api-key-name.sql:ro
      - ./vectorbee-backend/supabase/migrations/20260409_000002_enterprise_hierarchy_rbac.sql:/docker-entrypoint-initdb.d/06-enterprise-hierarchy-rbac.sql:ro
      - ./vectorbee-backend/supabase/migrations/20260409_000003_api_key_role.sql:/docker-entrypoint-initdb.d/07-api-key-role.sql:ro
      - ./vectorbee-backend/supabase/e2e-seed.sql:/docker-entrypoint-initdb.d/08-e2e-seed.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vectorbee -d vectorbee_test"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - vectorbee-e2e

  # ── Central Hub (Kotlin REST API + Postgres) ───────────────────────────────
  backend:
    build:
      context: ./vectorbee-backend
    container_name: vectorbee-e2e-backend
    environment:
      DATABASE_URL: postgresql://vectorbee:vectorbee@db:5432/vectorbee_test
      DB_URL: jdbc:postgresql://db:5432/vectorbee_test
      DB_USER: vectorbee
      DB_PASSWORD: vectorbee
      PORT: 8080
      # Auth: no dev-token bypass — all requests must use a real API key
      VECTORBEE_API_KEY: ${VECTORBEE_API_KEY:-vb_e2e_test_key_local}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- --header='Authorization: Bearer vb_e2e_test_key_local' http://127.0.0.1:8080/api/prompts >/dev/null 2>&1 || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - vectorbee-e2e

  # ── Next.js Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./vectorbee-ui
    container_name: vectorbee-e2e-frontend
    environment:
      API_URL: http://backend:8080
      NEXT_PUBLIC_API_URL: http://localhost:8080
      PORT: 3000
      VECTORBEE_API_KEY: ${VECTORBEE_API_KEY:-vb_e2e_test_key_local}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/settings >/dev/null 2>&1 || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - vectorbee-e2e

  # ── Socket directory initialiser ───────────────────────────────────────────
  # Runs once before the proxy starts. Sets the shared volume directory to
  # 0777 so the proxy user (UID from the proxy image) can create the socket
  # file, and the agent-tester user (root inside python:3.11-slim) can read it.
  # Exits immediately after chmod — it has no ongoing resource cost.
  init-sockets:
    image: busybox:1.36
    container_name: vectorbee-e2e-init-sockets
    volumes:
      - shared_sockets:/run/vectorbee
    command: ["sh", "-c", "chmod 1777 /run/vectorbee && echo 'socket dir ready'"]
    restart: "no"

  # ── Kotlin gRPC Proxy (data plane sidecar) ────────────────────────────────
  # Talks to the backend hub over HTTP (bridge network) and exposes the data
  # plane to the agent-tester exclusively via UDS at /run/vectorbee/vectorbee.sock.
  # No ports are published — there is nothing to expose over TCP.
  proxy:
    build:
      context: ./vectorbee-proxy
    container_name: vectorbee-e2e-proxy
    environment:
      # Where the proxy calls back to the central hub for prompt fetches
      # and audit batch uploads.
      VECTORBEE_HUB_URL: http://backend:8080
      # The API key used to authenticate against the hub. Override this with
      # a real vb_ key from the dashboard once onboarding is complete.
      VECTORBEE_KEY: ${VECTORBEE_API_KEY:?VECTORBEE_API_KEY must be set}
      # Ktor REST socket (healthcheck endpoint, used by ops tooling only).
      VECTORBEE_REST_SOCKET: /run/vectorbee/vectorbee-rest.sock
      # gRPC data-plane socket shared with the agent-tester via named volume.
      VECTORBEE_GRPC_SOCKET: /run/vectorbee/vectorbee.sock
    volumes:
      - shared_sockets:/run/vectorbee
    depends_on:
      backend:
        condition: service_healthy
      init-sockets:
        condition: service_completed_successfully
    # Healthcheck watches for the gRPC socket file. -S tests that the path
    # exists AND is a socket (not just a regular file or directory).
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/vectorbee/vectorbee.sock"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - vectorbee-e2e

  # ── Python Agent Tester ────────────────────────────────────────────────────
  # Reads prompts and posts audit events directly through the gRPC UDS socket.
  # No TCP hop: Python → /run/vectorbee/vectorbee.sock → Kotlin proxy in-process.
  agent-tester:
    image: python:3.11-slim
    container_name: vectorbee-e2e-agent-tester
    env_file:
      # Keys (OPENAI_API_KEY, VECTORBEE_API_KEY) loaded from the external project.
      - ../vectorbee_client_project/.env
    environment:
      # Tell the SDK where the socket lives inside this container.
      # Both containers mount shared_sockets at /run/vectorbee, so the path
      # is identical on both sides — no translation needed.
      VECTORBEE_GRPC_SOCKET: /run/vectorbee/vectorbee.sock
      # Explicitly unset any leftover HTTP proxy URL from the .env file so
      # the SDK does not fall back to TCP mode.
      VECTORBEE_PROXY_URL: ""
    volumes:
      # Shared socket directory — must be the same named volume as the proxy.
      - shared_sockets:/run/vectorbee
      # SDK root — writable so pip can write egg-info on editable install.
      - ../vectorbee_client_project:/app/sdk
      # Agent test scripts — read-only.
      - ../vectorbee_client_project/vectorbee_tester:/app/tester:ro
    command: >
      sh -c "pip install --upgrade pip --quiet
      && pip install -e /app/sdk --quiet --no-cache-dir
      && pip install openai grpcio protobuf --quiet --no-cache-dir
      && echo 'agent-tester ready — socket: '${VECTORBEE_GRPC_SOCKET}
      && tail -f /dev/null"
    depends_on:
      proxy:
        condition: service_healthy
    networks:
      - vectorbee-e2e

networks:
  vectorbee-e2e:
    driver: bridge

volumes:
  # Named volume shared between the proxy (writer) and agent-tester (reader).
  # init-sockets sets the directory to 1777 so both containers can use it
  # regardless of their internal UID/GID.
  shared_sockets:
    driver: local
