# Root aggregate only. Each child build still has no gradle.properties of its own, so
# `cd apps/worker-kotlin && ./gradlew build` behaves exactly as it always did — these
# settings apply to the composite invoked from here.

# WHY THE HEAP IS SET EXPLICITLY
# ------------------------------
# The aggregate compiles four Kotlin builds. Run from a clean state they compile
# CONCURRENTLY, and on the default daemon heap that reliably produced
#   e: Back-end (JVM) Internal error: Couldn't transform method node
# in api-kotlin and worker-kotlin at the same time — a Kotlin daemon under memory
# pressure, not a source error (each module compiles fine on its own). Giving the
# Kotlin daemon a real heap fixes it; the Gradle daemon is raised to match.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
kotlin.daemon.jvmargs=-Xmx2g

# One Kotlin daemon shared by every included build rather than one per build. Four
# daemons at 2g each is what pushed a laptop into swap in the first place.
kotlin.compiler.execution.strategy=daemon

# Included builds still build in parallel; the memory settings above are what make
# that safe. Turning this off would roughly triple a cold aggregate run.
org.gradle.parallel=true
org.gradle.caching=true
