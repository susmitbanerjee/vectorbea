[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vectorbea"
version = "0.2.0"
description = "Official Python SDK for the VectorBea prompt management platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [
    { name = "VectorBea", email = "support@vectorbea.com" },
]
keywords = ["vectorbea", "llm", "prompt", "ai", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
    "responses>=0.23",
]

[project.urls]
Homepage = "https://vectorbea.com"
Documentation = "https://vectorbea.com/docs"
Repository = "https://github.com/susmitbanerjee/vectorbea"

[tool.setuptools.packages.find]
where = ["."]
include = ["vectorbea*"]
