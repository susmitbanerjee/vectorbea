syntax = "proto3";

package vectorbea.v1;

option java_multiple_files = true;
option java_package = "com.vectorbea.proxy.grpc";
option java_outer_classname = "VectorBeaProto";

// Data plane RPCs served by the in-pod sidecar over a Unix Domain Socket.
// Latency target: sub-millisecond p50, no TCP, no TLS, no JSON.
service VectorBeaDataPlane {
  // Fetch a (cached) prompt by name. Falls through to the central hub on
  // a cache miss; subsequent reads are served from the local ConcurrentHashMap.
  rpc GetPrompt(GetPromptRequest) returns (GetPromptResponse);

  // Enqueue an audit event. Returns immediately after the event is accepted
  // into the in-memory channel — the AuditDispatcher batches and POSTs to the
  // hub asynchronously.
  rpc LogAudit(LogAuditRequest) returns (LogAuditResponse);

  // Enqueue workflow telemetry for asynchronous forwarding to the backend.
  rpc LogWorkflowEvents(LogWorkflowEventsRequest) returns (LogWorkflowEventsResponse);
}

message GetPromptRequest {
  string name = 1;
}

message GetPromptResponse {
  string prompt_id = 1;
  string prompt_version_id = 2;
  string organization_id = 3;
  string name = 4;
  string description = 5;
  string version_tag = 6;
  string template_text = 7;
  // The structured parameters object is serialised as a JSON string here so
  // we don't pull a transitive struct.proto dependency.
  string parameters_json = 8;
  string created_at = 9;
}

message LogAuditRequest {
  string prompt_version_id = 1;
  double proxy_latency_ms = 2;
  int32 llm_latency_ms = 3;
  int32 token_count = 4;
  string metadata_json = 5;
  // Human-readable prompt name and version (optional, used for audit log display)
  string prompt_name = 6;
  string version_tag = 7;
}

message LogAuditResponse {
  bool accepted = 1;
}

message LogWorkflowEventsRequest {
  string trace_id = 1;
  string workspace_id = 2;
  string capability_id = 3;
  string capability_version_id = 4;
  string capability_name = 5;
  string capability_version = 6;
  string environment = 7;
  string service_name = 8;
  string source = 9;
  string metadata_json = 10;
  repeated WorkflowEvent events = 11;
}

message WorkflowEvent {
  string type = 1;
  string span_id = 2;
  string parent_span_id = 3;
  string timestamp = 4;
  string provider = 5;
  string model = 6;
  string prompt_version = 7;
  string prompt_name = 8;
  string tool_name = 9;
  string mcp_server_name = 10;
  string status = 11;
  double latency_ms = 12;
  double cost_estimate = 13;
  int32 tokens_input = 14;
  int32 tokens_output = 15;
  string error_message = 16;
  string final_response = 17;
  string final_action = 18;
  string outcome_status = 19;
  string outcome_reason = 20;
  string input_json = 21;
  string output_json = 22;
  string response_json = 23;
  string result_json = 24;
  string arguments_json = 25;
  string query = 26;
  string documents_json = 27;
  string scores_json = 28;
  string selected_context = 29;
  string metadata_json = 30;
}

message LogWorkflowEventsResponse {
  bool accepted = 1;
  bool queued = 2;
  bool dropped = 3;
  string message = 4;
}
