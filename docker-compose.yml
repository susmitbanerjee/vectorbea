version: "3.9"

# =============================================================================
# Vectorbea Agent Scheduler — Docker Compose
#
# Typical local dev workflow (run apps natively for hot-reload):
#   cp .env.example .env          # first time only
#   docker compose up postgres redis -d
#   npm run db:migrate
#   npm run db:seed
#   npm run dev                   # starts web + worker with hot-reload
#
# Full-stack Docker mode (production-like, no hot-reload):
#   cp .env.example .env          # first time only
#   docker compose up -d          # starts all four services
#   # web → http://localhost:3000
#
# The .env file at the repo root is used by all services.
# =============================================================================

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vectorbea
      POSTGRES_PASSWORD: vectorbea
      POSTGRES_DB: vectorbea
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vectorbea -d vectorbea"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Redis (BullMQ queue backend) ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ── Web (Next.js control plane) ─────────────────────────────────────────────
  # Builds a production-like Next.js image. For hot-reload dev, run:
  #   npm run dev:web
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Override DB/Redis URLs to use Docker service names (not localhost)
      DATABASE_URL: postgresql://vectorbea:vectorbea@postgres:5432/vectorbea
      DIRECT_URL: postgresql://vectorbea:vectorbea@postgres:5432/vectorbea
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Worker (BullMQ scheduler + executor) ────────────────────────────────────
  # For hot-reload dev, run:
  #   npm run dev:worker
  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override DB/Redis URLs to use Docker service names (not localhost)
      DATABASE_URL: postgresql://vectorbea:vectorbea@postgres:5432/vectorbea
      REDIS_URL: redis://redis:6379
      APP_URL: http://web:3000
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
