services:
  vectorbea-proxy:
    image: vectorbea/vectorbea-proxy:latest
    environment:
      VECTORBEA_HUB_URL: ${VECTORBEA_HUB_URL:-https://dev.vectorbea.com}
      VECTORBEA_KEY: ${VECTORBEA_PROXY_API_KEY:-local-dev-placeholder}
      VECTORBEA_HTTP_PORT: 8080
      VECTORBEA_REST_SOCKET: /tmp/vectorbea-rest.sock
      VECTORBEA_GRPC_SOCKET: /tmp/vectorbea.sock
    ports:
      - "8080:8080"
    restart: unless-stopped
