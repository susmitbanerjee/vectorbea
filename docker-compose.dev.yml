services:
  vectorbea-agent:
    build:
      context: ./vectorbea-outbound-agent
    environment:
      VECTORBEA_API_URL: https://dev.vectorbea.com
      VECTORBEA_AGENT_TOKEN: ${VECTORBEA_AGENT_TOKEN:?VECTORBEA_AGENT_TOKEN must be set}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-15000}
      VECTORBEA_SHARED_CONFIG_DIR: /app/shared-config
      VECTORBEA_RULES_PATH: /app/shared-config/rules.json
      VECTORBEA_CONFIG_PATH: /app/shared-config/config.json
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      VECTORBEA_TARGET_CONTAINER_NAME: vectorbea-core
    volumes:
      - shared_config:/app/shared-config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  vectorbea-proxy:
    build:
      context: ./vectorbea-proxy
    environment:
      VECTORBEA_HUB_URL: ${VECTORBEA_HUB_URL:-https://dev.vectorbea.com}
      VECTORBEA_KEY: ${VECTORBEA_PROXY_API_KEY:-local-dev-placeholder}
      VECTORBEA_HTTP_PORT: 8080
      VECTORBEA_SHARED_RULES_PATH: /app/shared-config/rules.json
      VECTORBEA_REST_SOCKET: /tmp/vectorbea-rest.sock
      VECTORBEA_GRPC_SOCKET: /tmp/vectorbea.sock
    volumes:
      - shared_config:/app/shared-config
    ports:
      - "8080:8080"
    depends_on:
      - vectorbea-agent
    restart: unless-stopped

volumes:
  shared_config:
    driver: local
