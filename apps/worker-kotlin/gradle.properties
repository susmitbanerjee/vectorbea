# Standalone builds do not inherit the repository root's memory settings.
#
# WHY THIS FILE EXISTS
# --------------------
# The root `gradle.properties` raises the Kotlin daemon heap and explains why:
# on the default heap, compiling these modules reliably produces
#   e: Back-end (JVM) Internal error: Couldn't transform method node
# whose root cause, several hundred stack frames down, is an OutOfMemoryError in
# ASM's frame analyser. It is a daemon under memory pressure, not a source
# error — which is why it names an arbitrary small method (`readAuth` in
# `HttpAuthSpec`, say) that has nothing wrong with it, and why the file it names
# changes between runs.
#
# Those root settings apply only to the composite invoked from the repository
# root. `api-kotlin` therefore carries its own copy for builds run from its
# directory, and this module did not — so `cd apps/worker-kotlin && ./gradlew
# build` ran the Kotlin daemon on its default heap. That is the LARGEST Kotlin
# module in the repo, so it was the one closest to the edge, and it went over as
# soon as a phase added sources.
#
# It only shows up on a FULL compile. Incremental builds recompile a handful of
# files and stay well inside the default heap, so `./gradlew build` passes all
# day and `--rerun-tasks`, a fresh clone or CI fails — which makes it read as a
# code error introduced by whatever landed last.
#
# The Kotlin daemon gets the same 2g the root and `api-kotlin` give it, since
# that is the figure already shown to be sufficient. The Gradle daemon gets more
# than `api-kotlin`'s 1g because this module's test tier holds containers and
# fixtures that one does not.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m
kotlin.daemon.jvmargs=-Xmx2g
