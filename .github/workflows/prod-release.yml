name: Release — Build & Push

on:
  push:
    branches: [release]
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository }}/vectorbee-backend
  IMAGE_UI: ghcr.io/${{ github.repository }}/vectorbee-ui

jobs:
  # ──────────────────────────────────────────────
  # 1. Determine version tag
  # ──────────────────────────────────────────────
  meta:
    name: Compute image tags
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha_short: ${{ steps.version.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="sha-${SHA_SHORT}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────
  # 2. Backend — test, build, push image
  # ──────────────────────────────────────────────
  backend:
    name: Backend image
    runs-on: ubuntu-latest
    needs: meta
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: vectorbee-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          build-root-directory: vectorbee-backend

      - name: Run tests
        run: gradle test --no-daemon

      - name: Build distribution
        run: gradle installDist --no-daemon

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: vectorbee-backend
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ needs.meta.outputs.version }}
            ${{ env.IMAGE_BACKEND }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  # ──────────────────────────────────────────────
  # 3. UI — build, push image
  # ──────────────────────────────────────────────
  ui:
    name: UI image
    runs-on: ubuntu-latest
    needs: meta
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push UI image
        uses: docker/build-push-action@v5
        with:
          context: vectorbee-ui
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ env.IMAGE_UI }}:${{ needs.meta.outputs.version }}
            ${{ env.IMAGE_UI }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  # ──────────────────────────────────────────────
  # 4. E2E gate before deploy
  # ──────────────────────────────────────────────
  e2e:
    name: E2E smoke
    runs-on: ubuntu-latest
    needs: [backend, ui]
    env:
      VECTORBEE_API_KEY: vb_e2e_test_key_local
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose -f docker-compose.e2e.yml up -d --build --wait --no-deps db backend frontend
        timeout-minutes: 10

      - name: Smoke — API
        run: |
          curl -sf \
            -H "Authorization: Bearer $VECTORBEE_API_KEY" \
            http://localhost:8080/api/prompts

      - name: Smoke — UI
        run: curl -sf http://localhost:3000/

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v

  # ──────────────────────────────────────────────
  # 5. Create GitHub Release (tag pushes only)
  # ──────────────────────────────────────────────
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [e2e, meta]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.version }}
          generate_release_notes: true
          body: |
            ## Docker images

            ```
            docker pull ${{ env.IMAGE_BACKEND }}:${{ needs.meta.outputs.version }}
            docker pull ${{ env.IMAGE_UI }}:${{ needs.meta.outputs.version }}
            ```
