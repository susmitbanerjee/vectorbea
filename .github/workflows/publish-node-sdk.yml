name: Publish Node.js SDK to npm

on:
  push:
    tags:
      - "sdk/node/v*"   # trigger on tags like sdk/node/v0.2.1

jobs:
  publish:
    name: Build, gate, and publish @vectorbea-ai/node
    runs-on: ubuntu-latest
    environment: npm

    permissions:
      contents: read   # required to checkout the repository

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        working-directory: sdk/node
        run: npm ci

      - name: Build (compile TypeScript → dist/)
        working-directory: sdk/node
        run: npm run build

      - name: Secret scan (blocks publish on any credential match)
        working-directory: sdk/node
        run: bash scripts/scan-secrets.sh dist

      - name: Dry-run pack (verifies publish surface)
        working-directory: sdk/node
        run: npm pack --dry-run

      - name: Publish to npm
        working-directory: sdk/node
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
