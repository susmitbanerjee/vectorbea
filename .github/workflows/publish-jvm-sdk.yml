name: Publish JVM SDK to Maven Central

on:
  push:
    tags:
      - "sdk/jvm/v*"   # trigger on tags like sdk/jvm/v0.2.1

jobs:
  # ── Gate: build + test ───────────────────────────────────────────────────────
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper   # reads gradle/wrapper/gradle-wrapper.properties

      - name: Build
        working-directory: sdk/jvm
        run: ./gradlew build --no-daemon

      - name: Run tests
        working-directory: sdk/jvm
        run: ./gradlew test --no-daemon

      - name: Secret scan (src/main)
        working-directory: sdk/jvm
        run: bash scripts/scan-secrets.sh

  # ── Gate: verify publication artifacts ──────────────────────────────────────
  verify-publication:
    name: Verify publication artifacts
    runs-on: ubuntu-latest
    needs: build-and-test

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Publish to Maven Local (packaging gate)
        working-directory: sdk/jvm
        run: ./gradlew publishToMavenLocal --no-daemon

      - name: Confirm expected artifacts exist
        run: |
          BASE="$HOME/.m2/repository/com/vectorbea/vectorbea-jvm-sdk"
          VERSION="${GITHUB_REF_NAME#sdk/jvm/v}"
          echo "Checking artifacts for version $VERSION"
          for SUFFIX in "" "-sources" "-javadoc"; do
            JAR="$BASE/$VERSION/vectorbea-jvm-sdk-$VERSION$SUFFIX.jar"
            if [[ ! -f "$JAR" ]]; then
              echo "✖  Missing: $JAR"
              exit 1
            else
              echo "✔  Found:   $JAR"
            fi
          done
          POM="$BASE/$VERSION/vectorbea-jvm-sdk-$VERSION.pom"
          if [[ ! -f "$POM" ]]; then
            echo "✖  Missing: $POM"
            exit 1
          fi
          echo "✔  All artifacts present."

      - name: Secret scan (build/publications)
        working-directory: sdk/jvm
        run: bash scripts/scan-secrets.sh

  # ── Publish to Maven Central ─────────────────────────────────────────────────
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    needs: verify-publication
    environment: maven-central

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Publish to Maven Central Portal
        working-directory: sdk/jvm
        run: ./gradlew publishAllPublicationsToCentralPortal --no-daemon
        env:
          GPG_PRIVATE_KEY:        ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE:         ${{ secrets.GPG_PASSPHRASE }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
