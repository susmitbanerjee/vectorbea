name: Publish JVM SDK to Maven Central

on:
  push:
    tags:
      - "sdk/jvm/v*"

jobs:
  publish:
    name: Build, gate, and publish com.vectorbea:vectorbea-jvm-sdk
    runs-on: ubuntu-latest
    environment: maven-central

    permissions:
      contents: read

    defaults:
      run:
        working-directory: sdk/jvm

    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build SDK
        run: ./gradlew --no-daemon clean build

      - name: Secret scan
        run: bash scripts/scan-secrets.sh

      - name: Decode GPG signing key
        shell: bash
        run: |
          printf '%s' '${{ secrets.GPG_PRIVATE_KEY_BASE64 }}' | base64 --decode > /tmp/vectorbea-signing-key.asc
          {
            echo 'ORG_GRADLE_PROJECT_signingInMemoryKey<<EOF'
            cat /tmp/vectorbea-signing-key.asc
            echo
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Publish dry-run to Maven Local
        # No -PsignPublication — packaging gate only, no signing needed.
        run: ./gradlew --no-daemon publishToMavenLocal

      - name: Publish to Maven Central
        run: ./gradlew --no-daemon publishAndReleaseToMavenCentral
