name: Publish JVM SDK to Maven Central

on:
  push:
    tags:
      - "sdk/jvm/v*"

jobs:
  publish:
    name: Build, gate, and publish com.vectorbea:vectorbea-jvm-sdk
    runs-on: ubuntu-latest
    environment: maven-central

    permissions:
      contents: read

    defaults:
      run:
        working-directory: sdk/jvm

    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build SDK
        run: ./gradlew --no-daemon clean build

      - name: Secret scan
        run: bash scripts/scan-secrets.sh

      - name: Publish dry-run to Maven Local
        # No -PsignPublication here — this is a packaging gate only.
        # signAllPublications() is never called at configuration time, so no
        # .asc artifacts are registered and the local publish succeeds cleanly.
        run: ./gradlew --no-daemon publishToMavenLocal

      - name: Publish to Maven Central
        # -PsignPublication activates signAllPublications() in build.gradle.kts.
        # The in-memory GPG key is read from ORG_GRADLE_PROJECT_signingInMemoryKey.
        run: ./gradlew --no-daemon publishAndReleaseToMavenCentral -PsignPublication
