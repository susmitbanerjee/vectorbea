name: Deploy Production Proxy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  IMAGE_NAME: vectorbea/vectorbea-proxy

jobs:
  # ── Tests ─────────────────────────────────────────────────────────────────────
  test:
    name: Run proxy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: vectorbea-proxy
      - name: Make Gradle wrapper executable
        working-directory: vectorbea-proxy
        run: chmod +x gradlew
      - name: Run tests
        working-directory: vectorbea-proxy
        run: ./gradlew --no-daemon test

  # ── Native build for linux/amd64 ─────────────────────────────────────────────
  build-amd64:
    name: Build native image (amd64)
    runs-on: ubuntu-latest
    needs: test
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push amd64 native image
        uses: docker/build-push-action@v6
        with:
          context: ./vectorbea-proxy
          file: ./vectorbea-proxy/Dockerfile.native
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=prod-amd64
          cache-to: type=gha,scope=prod-amd64,mode=max
          tags: ${{ env.IMAGE_NAME }}:prod-amd64

  # ── Native build for linux/arm64 ─────────────────────────────────────────────
  build-arm64:
    name: Build native image (arm64)
    runs-on: ubuntu-24.04-arm
    needs: test
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push arm64 native image
        uses: docker/build-push-action@v6
        with:
          context: ./vectorbea-proxy
          file: ./vectorbea-proxy/Dockerfile.native
          platforms: linux/arm64
          push: true
          cache-from: type=gha,scope=prod-arm64
          cache-to: type=gha,scope=prod-arm64,mode=max
          tags: ${{ env.IMAGE_NAME }}:prod-arm64

  # ── Combine into multi-arch manifest ─────────────────────────────────────────
  push-manifest:
    name: Push multi-arch manifest
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    environment: production
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE_NAME }}:latest \
            --tag ${{ env.IMAGE_NAME }}:sha-${{ github.sha }} \
            ${{ env.IMAGE_NAME }}:prod-amd64 \
            ${{ env.IMAGE_NAME }}:prod-arm64
      - name: Inspect manifest
        run: docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:latest
