name: Publish Multi-Arch Proxy

# ── Triggers ──────────────────────────────────────────────────────────────────
#
# This workflow publishes the customer-distribution Docker image to Docker Hub.
# It runs on GitHub Releases (the canonical release event) so the published tag
# matches the release version exactly.
#
# Relationship to other workflows:
#   deploy-dev.yml   — push to dev    → native amd64 image for VectorBea's own dev infra
#   deploy-prod.yml  — push to main   → native amd64 image for VectorBea's own prod infra
#   publish-proxy.yml (this file)
#                    — GitHub Release → multi-arch JVM image for customer Docker Hub pull

on:
  release:
    types: [published]
  workflow_dispatch:    # allow manual trigger from the Actions tab
    inputs:
      version:
        description: "Version tag to apply (e.g. 0.1.0) — leave blank to use 'dev'"
        required: false
        default: "dev"

concurrency:
  group: publish-proxy-${{ github.ref }}
  cancel-in-progress: false   # never cancel a release publish mid-flight

env:
  REGISTRY: docker.io
  IMAGE_NAME: vectorbea/vectorbea-proxy

jobs:
  # ── 1. Tests ──────────────────────────────────────────────────────────────────
  test:
    name: Run proxy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: vectorbea-proxy
      - name: Make Gradle wrapper executable
        working-directory: vectorbea-proxy
        run: chmod +x gradlew
      - name: Run tests
        working-directory: vectorbea-proxy
        run: ./gradlew --no-daemon test

  # ── 2. Extract version ────────────────────────────────────────────────────────
  version:
    name: Extract version
    runs-on: ubuntu-latest
    needs: test
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: Resolve version string
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            RAW="${{ github.event.release.tag_name }}"
            VERSION="${RAW#v}"
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION}"

  # ── 3. Native build for linux/amd64 ──────────────────────────────────────────
  build-amd64:
    name: Build native image (amd64)
    runs-on: ubuntu-latest
    needs: version
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push amd64 native image
        uses: docker/build-push-action@v6
        with:
          context: ./vectorbea-proxy
          file: ./vectorbea-proxy/Dockerfile.native
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=publish-amd64
          cache-to: type=gha,scope=publish-amd64,mode=max
          tags: ${{ env.IMAGE_NAME }}:${{ needs.version.outputs.value }}-amd64
          labels: |
            org.opencontainers.image.title=VectorBea Proxy
            org.opencontainers.image.description=VectorBea sidecar proxy — enterprise AI infrastructure
            org.opencontainers.image.version=${{ needs.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=https://vectorbea.com/docs/quickstart

  # ── 4. Native build for linux/arm64 (real arm64 runner — no emulation) ────────
  build-arm64:
    name: Build native image (arm64)
    runs-on: ubuntu-24.04-arm
    needs: version
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push arm64 native image
        uses: docker/build-push-action@v6
        with:
          context: ./vectorbea-proxy
          file: ./vectorbea-proxy/Dockerfile.native
          platforms: linux/arm64
          push: true
          cache-from: type=gha,scope=publish-arm64
          cache-to: type=gha,scope=publish-arm64,mode=max
          tags: ${{ env.IMAGE_NAME }}:${{ needs.version.outputs.value }}-arm64
          labels: |
            org.opencontainers.image.title=VectorBea Proxy
            org.opencontainers.image.description=VectorBea sidecar proxy — enterprise AI infrastructure
            org.opencontainers.image.version=${{ needs.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=https://vectorbea.com/docs/quickstart

  # ── 5. Combine into a single multi-arch manifest ──────────────────────────────
  push-manifest:
    name: Push multi-arch manifest
    runs-on: ubuntu-latest
    needs: [version, build-amd64, build-arm64]
    environment: production
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE_NAME }}:latest \
            --tag ${{ env.IMAGE_NAME }}:${{ needs.version.outputs.value }} \
            ${{ env.IMAGE_NAME }}:${{ needs.version.outputs.value }}-amd64 \
            ${{ env.IMAGE_NAME }}:${{ needs.version.outputs.value }}-arm64
      - name: Inspect published manifest
        run: |
          docker buildx imagetools inspect \
            ${{ env.IMAGE_NAME }}:${{ needs.version.outputs.value }}
