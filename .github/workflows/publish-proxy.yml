name: Publish Multi-Arch Proxy

# ── Triggers ──────────────────────────────────────────────────────────────────
#
# This workflow publishes the customer-distribution Docker image to Docker Hub.
# It runs on GitHub Releases (the canonical release event) so the published tag
# matches the release version exactly.
#
# Relationship to other workflows:
#   deploy-dev.yml   — push to dev    → native amd64 image for VectorBea's own dev infra
#   deploy-prod.yml  — push to main   → native amd64 image for VectorBea's own prod infra
#   publish-proxy.yml (this file)
#                    — GitHub Release → multi-arch JVM image for customer Docker Hub pull

on:
  release:
    types: [published]

concurrency:
  group: publish-proxy-${{ github.ref }}
  cancel-in-progress: false   # never cancel a release publish mid-flight

env:
  REGISTRY: docker.io
  IMAGE_NAME: vectorbea/vectorbea-proxy

jobs:
  # ── 1. Run tests on the host runner before committing 20+ minutes to Docker ──
  test:
    name: Run proxy tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: vectorbea-proxy

      - name: Make Gradle wrapper executable
        working-directory: vectorbea-proxy
        run: chmod +x gradlew

      - name: Run tests
        working-directory: vectorbea-proxy
        run: ./gradlew --no-daemon test

  # ── 2. Build and push the multi-arch image ────────────────────────────────
  build-and-push:
    name: Build and push multi-arch image
    runs-on: ubuntu-latest
    needs: test
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # QEMU provides user-space emulation for arm64 on the amd64 GitHub runner.
      # The Dockerfile uses --platform=$BUILDPLATFORM for the Gradle builder stage
      # so Gradle itself always runs natively at full speed. Only the lightweight
      # eclipse-temurin runtime stage (groupadd / useradd / mkdir) needs QEMU.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      # The docker-container buildx driver is required for multi-platform builds.
      # The default 'docker' driver cannot push multi-arch manifests.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Derive clean version string from the GitHub Release tag.
      # Release tag format: v1.2.3  →  version: 1.2.3
      - name: Extract version from release tag
        id: version
        run: |
          RAW="${{ github.event.release.tag_name }}"
          VERSION="${RAW#v}"   # strip leading 'v' if present
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION}"

      # Build for both platforms simultaneously and push a multi-arch manifest
      # to Docker Hub. Docker Hub and every OCI-compliant registry will serve
      # the correct layer automatically based on the pulling machine's arch.
      #
      # Cross-compilation notes:
      #   - The builder stage uses --platform=$BUILDPLATFORM (see Dockerfile),
      #     so Gradle runs on the native amd64 runner at full speed.
      #   - The runtime stage (eclipse-temurin:21-jre-jammy) has native layers
      #     for both amd64 and arm64 — Docker selects the correct one.
      #   - The JVM JAR is platform-neutral bytecode, so the same artifact
      #     copied into both runtime images is correct and intentional.
      #
      # Cache strategy:
      #   type=gha stores Docker layer blobs in the GitHub Actions cache.
      #   mode=max caches all layers including intermediate stages so the
      #   Gradle dependency layer survives source-only pushes.
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: ./vectorbea-proxy
          file: ./vectorbea-proxy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}
          labels: |
            org.opencontainers.image.title=VectorBea Proxy
            org.opencontainers.image.description=VectorBea sidecar proxy — enterprise AI infrastructure
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=https://vectorbea.com/docs/quickstart

      # Print the multi-arch manifest digest so it is permanently recorded in
      # the release job log for audit purposes.
      - name: Inspect published manifest
        run: |
          docker buildx imagetools inspect \
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}
