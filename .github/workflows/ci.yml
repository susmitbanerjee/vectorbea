name: CI

# CI runs CHECKS only — deployments are owned by the platform git integrations:
#   PR / push to dev    → Vercel deploys apps/web to dev.vectorbea.com (staging)
#                         + Railway `staging` env (api/worker, branch=dev)
#   merge dev → master  → Vercel production (vectorbea.com, blog, support domain)
#                         + Railway `production` env
# Per-path filters below keep a PR from building services it didn't touch.

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  # ── What changed? — gates every other job ───────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      worker: ${{ steps.filter.outputs.worker }}
      observability: ${{ steps.filter.outputs.observability }}
      monitoring: ${{ steps.filter.outputs.monitoring }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'prisma/**'
              # The API contracts live here and the web app typechecks against
              # them, so a schema change can break the build without touching a
              # file under apps/web.
              - 'packages/shared/**'
            api:
              - 'apps/api-kotlin/**'
              # Every one of these compiles INTO the api via includeBuild, so a
              # change in any of them can break this build without touching a
              # file under apps/api-kotlin. The list has to match
              # apps/api-kotlin/settings.gradle.kts — it listed only
              # observability-kotlin while three more were being included, which
              # meant a change to a shared module could land with this job never
              # having run against it.
              - 'packages/observability-kotlin/**'
              - 'packages/graph-kotlin/**'
              - 'packages/skills-kotlin/**'
              - 'packages/mcp-kotlin/**'
              # The api compiles a handful of worker source roots directly (see
              # sourceSets.main and the Dockerfile), so those break it too.
              - 'apps/worker-kotlin/src/main/kotlin/com/vectorbea/worker/contract/**'
              - 'apps/worker-kotlin/src/main/kotlin/com/vectorbea/worker/tools/httpspec/**'
            worker:
              - 'apps/worker-kotlin/**'
              - 'packages/observability-kotlin/**'
              - 'packages/graph-kotlin/**'
              - 'packages/skills-kotlin/**'
              - 'packages/mcp-kotlin/**'
            observability:
              - 'packages/observability-kotlin/**'
            monitoring:
              - 'ops/monitoring/**'
              - 'scripts/monitoring/**'
              - 'docs/telemetry/RUNBOOKS.md'
              # The dashboards and alerts are checked against the metric names in
              # these files. Renaming a metric here without updating a panel is the
              # exact break this job exists to catch, and it touches no file under
              # ops/ — so a path filter on ops/ alone would sail straight past it.
              - 'apps/worker-kotlin/src/main/kotlin/com/vectorbea/worker/metrics/WorkerMetrics.kt'
              - 'apps/api-kotlin/src/main/kotlin/com/vectorbea/api/metrics/AppMetrics.kt'
              - 'packages/observability-kotlin/src/main/kotlin/com/vectorbea/observability/metrics/**'

  # ── Closed-source boundary guards (cheap, always run) ───────────────────────
  guards:
    name: Source boundary guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if Stripe/Razorpay imported in production frontend
        run: |
          if grep -r "stripe\|razorpay" apps/web/app --include="*.tsx" --include="*.ts" -i | grep -v ".test.\|spec.\|//"; then
            echo "ERROR: Stripe/Razorpay references found in frontend production code."
            exit 1
          fi
          echo "OK: No billing provider in frontend"

      - name: Fail if frontend imports server-only modules
        run: |
          forbidden_patterns="@/lib/generated/prisma|@/server/db|@/lib/server/secret-service|from.*redis|from.*bullmq"
          if grep -rE "$forbidden_patterns" apps/web/app --include="*.tsx" --include="*.ts" | grep -v ".test.\|spec.\|//"; then
            echo "ERROR: Frontend imports server-only module."
            exit 1
          fi
          echo "OK: No server module imports in frontend"

  # ── Web frontend ────────────────────────────────────────────────────────────
  web:
    name: Web (typecheck + lint + build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      # Installed from the REPO ROOT, not apps/web. The web app depends on the
      # workspace package @vectorbea/shared, which only resolves through the
      # root workspaces config — `npm ci` inside apps/web cannot see it and
      # would try (and fail) to fetch it from the registry.
      - name: Install dependencies
        working-directory: .
        run: npm ci

      # @vectorbea/shared publishes from dist/, so it must be compiled before
      # anything typechecks against it. This is also the contract gate: if the
      # Zod schemas in packages/shared stop compiling, the web build stops here
      # rather than failing later with a confusing module-resolution error.
      - name: Build shared contracts
        working-directory: packages/shared
        run: npm run build

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Design constitution — /CLAUDE.md. Fails on raw hex/rgb/hsl, default
      # Tailwind palette classes, Lucide imports or emoji anywhere in
      # apps/web/src. Also prints the legacy migration baseline.
      - name: Design token guardrails
        run: npm run check:tokens

      # WCAG contrast for every semantic pairing in both themes, plus the
      # brand/status disjointness rule. See src/styles/tokens/colour.css.
      - name: Contrast and governing rule
        run: npm run check:contrast

      - name: Architecture boundaries
        run: npm run check:boundaries

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_VECTORBEA_API_URL: "https://api.vectorbea.com"
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
          NEXT_PUBLIC_PRIVATE_BETA_MODE: "true"

  # ── API (Kotlin) ────────────────────────────────────────────────────────────
  api-kotlin:
    name: API Kotlin (build + test)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api-kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build
        run: bash ./gradlew build --no-daemon --console=plain -x test
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx512m -Dkotlin.compiler.execution.strategy=in-process"

      # `continue-on-error: true` was here, with the note "tests are advisory
      # until full coverage added". It made a red suite indistinguishable from a
      # green one, which is the same failure mode as a skipped test. The unit
      # tier is 286/286 green, so this is safe to enforce now.
      - name: Test (unit tier)
        run: bash ./gradlew test --no-daemon --console=plain
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx512m -Dkotlin.compiler.execution.strategy=in-process"

  # ── Worker (Kotlin) ─────────────────────────────────────────────────────────
  worker-kotlin:
    name: Worker Kotlin (build + test)
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker-kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build
        run: bash ./gradlew build --no-daemon --console=plain -x test
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx512m -Dkotlin.compiler.execution.strategy=in-process"

      # The unit tier: no containers, so it runs on every PR.
      #
      # This job used to build and stop. 542 worker tests existed and none of
      # them had ever run in CI.
      - name: Test (unit tier)
        run: bash ./gradlew test --no-daemon --console=plain
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx512m -Dkotlin.compiler.execution.strategy=in-process"

  # ── Observability library (Kotlin) ──────────────────────────────────────────
  # Was the `telemetry` service job. The service is gone; the library it became is
  # built and tested on its own so a break is attributed here rather than surfacing
  # as a confusing failure inside the api or worker build.
  observability:
    name: Observability library (build + test)
    needs: changes
    if: needs.changes.outputs.observability == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/observability-kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build
        run: gradle build --no-daemon --console=plain -x test
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx512m -Dkotlin.compiler.execution.strategy=in-process"

      - name: Test
        run: gradle test --no-daemon --console=plain
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx512m -Dkotlin.compiler.execution.strategy=in-process"

  # ── Monitoring stack (config only, no containers of ours) ───────────────────
  #
  # WHY THIS JOB EXISTS
  # The whole ops/monitoring stack was written, reviewed, committed — and had never
  # worked. Dashboards rendered nothing, alerts routed nowhere, and the scrape config
  # named hosts that do not exist in this deployment. None of it failed, because none
  # of it was checked. Config that is never executed rots like code that is never run,
  # and it rots more quietly: a broken dashboard renders as an empty graph, which is
  # visually identical to a healthy system with nothing happening.
  #
  # Cheap — three container pulls and a Node script, no build, no services of ours.
  monitoring:
    name: Monitoring stack (config validation)
    needs: changes
    if: needs.changes.outputs.monitoring == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Dashboards, alerts, runbook coverage, and — the one that matters — that every
      # metric a panel references actually exists in the Kotlin source.
      - name: Validate dashboards, alerts and runbooks
        run: node scripts/monitoring/validate.mjs

      # promtool is the only thing that actually parses PromQL. The check above knows
      # which identifiers are metrics; this knows whether the expression is valid at
      # all. Both are needed: a syntactically perfect query against a metric that does
      # not exist passes here and returns nothing forever.
      # Every config below interpolates ${VAR} placeholders that only exist at
      # runtime, so each is checked with a substituted copy rather than not checked
      # at all. Substituting is safe here: these tools validate STRUCTURE, and no
      # structural rule depends on the value of a token or a hostname.
      - name: Stage configs with placeholders substituted
        run: |
          mkdir -p /tmp/promcheck /tmp/amcheck/templates
          sed 's/\${[A-Z_]*}/ci/g' ops/monitoring/prometheus/prometheus.yml > /tmp/promcheck/prometheus.yml
          cp ops/monitoring/prometheus/alerts.yml /tmp/promcheck/alerts.yml
          # Plausible values, not the generic "ci" placeholder: amtool validates that
          # a receiver's `to` parses as an email and that a webhook url parses as a
          # URL, so a placeholder would fail the check for the wrong reason.
          sed -e 's|${ALERT_EMAIL}|ci@example.com|g' \
              -e 's|${ALERT_WEBHOOK_URL}|https://example.com/hook|g' \
              -e 's|${SMTP_HOST}|smtp.example.com|g' \
              -e 's|${SMTP_USER}|ci|g' \
              -e 's|${SMTP_PASSWORD}|ci|g' \
              ops/monitoring/alertmanager/alertmanager.yml > /tmp/amcheck/alertmanager.yml
          cp ops/monitoring/alertmanager/templates/*.tmpl /tmp/amcheck/templates/

      # promtool is the only thing that actually parses PromQL. The Node check above
      # knows which identifiers are metrics; this knows whether the expression is
      # valid at all. Both are needed — a syntactically perfect query against a
      # metric that does not exist passes promtool and returns nothing forever.
      - name: promtool — alert rules
        run: docker run --rm -v /tmp/promcheck:/cfg --entrypoint promtool prom/prometheus:v2.54.1 check rules /cfg/alerts.yml

      - name: promtool — scrape config
        run: docker run --rm -v /tmp/promcheck:/cfg --entrypoint promtool prom/prometheus:v2.54.1 check config /cfg/prometheus.yml

      # Catches an unroutable alert: a receiver that does not exist, a matcher that
      # parses but matches nothing, a template that references a missing field.
      - name: amtool — alertmanager routing
        run: docker run --rm -v /tmp/amcheck:/cfg --entrypoint amtool prom/alertmanager:v0.27.0 check-config /cfg/alertmanager.yml

      # The agent config is the piece with no other coverage. It runs in every
      # environment, and nothing else would notice it being malformed until that
      # environment silently stopped reporting — which looks like calm.
      # Env vars the collector config requires. `validate` resolves them, so an
      # unset one fails the check for the wrong reason.
      - name: otelcol — central collector config
        env:
          TELEMETRY_INGEST_TOKEN: ci
          OTLP_HTTP_PORT: "4318"
          PROMETHEUS_REMOTE_WRITE_ENDPOINT: http://127.0.0.1:9090/api/v1/write
          TEMPO_ENDPOINT: 127.0.0.1:4317
        run: |
          docker run --rm -v "$PWD/ops/monitoring/otel:/cfg"             -e TELEMETRY_INGEST_TOKEN -e OTLP_HTTP_PORT             -e PROMETHEUS_REMOTE_WRITE_ENDPOINT -e TEMPO_ENDPOINT             otel/opentelemetry-collector-contrib:0.109.0 validate --config=/cfg/config.yml

      # The all-in-one image is the deployed artefact. Building it in CI is the only
      # thing that catches a bad COPY path, a missing binary in an upstream image, or
      # a shell script that picked up CRLF endings on a Windows checkout — all three
      # of which have already happened once.
      - name: Build the all-in-one image
        run: docker build -f ops/monitoring/railway/allinone.Dockerfile -t vb-monitoring:ci .

      - name: otelcol — per-environment agent config
        run: docker run --rm -v "$PWD/ops/monitoring/agent:/cfg" otel/opentelemetry-collector-contrib:0.109.0 validate --config=/cfg/config.yml

  # ── Integration tier (containers required) ──────────────────────────────────
  #
  # Runs the WHOLE suite — unit plus the container-backed tests — against a real
  # Postgres, Redis and OTLP collector.
  #
  # WHY ONLY ON MERGE. It costs ~2.5 minutes and three service containers, which
  # is the wrong trade on every push to a branch. The unit tier gates PRs; this
  # gates what lands.
  #
  # WHY `services:` RATHER THAN LETTING TESTCONTAINERS DO IT. Both work on a
  # Linux runner. `services:` pulls the images once, in parallel with checkout,
  # and its health checks are the runner's problem rather than the JVM's — and
  # it exercises the same env-var path a developer uses with
  # `docker compose --profile test up`. Testcontainers stays the fallback for
  # anyone who has not started anything.
  #
  # There is deliberately NO `continue-on-error` here. The point of this job is
  # to be able to fail.
  integration:
    name: Integration (Postgres + Redis + OTLP)
    needs: changes
    if: github.event_name == 'push' && (needs.changes.outputs.api == 'true' || needs.changes.outputs.worker == 'true')
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vectorbea
          POSTGRES_PASSWORD: vectorbea
          POSTGRES_DB: vectorbea_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vectorbea -d vectorbea_test"
          --health-interval 5s --health-timeout 5s --health-retries 12

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

      jaeger:
        image: jaegertracing/all-in-one:1.57
        env:
          COLLECTOR_OTLP_ENABLED: "true"
        ports: ["4318:4318", "16686:16686"]

    env:
      # `Infra` prefers these over starting its own containers.
      TEST_DATABASE_URL: "jdbc:postgresql://localhost:5432/vectorbea_test?user=vectorbea&password=vectorbea"
      TEST_REDIS_URL: "redis://localhost:6379"
      TEST_OTLP_ENDPOINT: "http://localhost:4318"
      TEST_JAEGER_QUERY_URL: "http://localhost:16686"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx1g -Dkotlin.compiler.execution.strategy=in-process"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Jaeger has no health check the runner understands, so wait for the query
      # API rather than discovering it is not up from inside a test assertion.
      - name: Wait for the collector
        run: |
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:16686/ && exit 0
            sleep 2
          done
          echo "Jaeger query API never came up"; exit 1

      - name: Worker — integration tier
        if: needs.changes.outputs.worker == 'true'
        working-directory: apps/worker-kotlin
        run: bash ./gradlew integrationTest --no-daemon --console=plain

      - name: API — integration tier
        if: needs.changes.outputs.api == 'true'
        working-directory: apps/api-kotlin
        run: bash ./gradlew integrationTest --no-daemon --console=plain

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            apps/worker-kotlin/build/test-results/integrationTest/**/*.xml
            apps/api-kotlin/build/test-results/integrationTest/**/*.xml
          if-no-files-found: ignore
