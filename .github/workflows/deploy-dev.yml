name: Deploy Dev Proxy

on:
  push:
    branches:
      - dev

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  IMAGE_NAME: vectorbea/vectorbea-proxy

jobs:
  build-and-push:
    name: Build and push dev proxy image (native)
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Run tests on the host runner for fast early feedback before committing
      # 10+ minutes to the native-image compile step inside Docker.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: vectorbea-proxy

      - name: Make Gradle wrapper executable
        working-directory: vectorbea-proxy
        run: chmod +x gradlew

      - name: Run proxy tests
        working-directory: vectorbea-proxy
        run: ./gradlew --no-daemon test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push native dev image
        uses: docker/build-push-action@v6
        with:
          context: ./vectorbea-proxy
          file: ./vectorbea-proxy/Dockerfile.native
          push: true
          # GHA cache persists Docker layer blobs between runs.
          # The dependency pre-fetch layer (./gradlew dependencies) is typically
          # the largest cached layer (~500 MB) and survives source-only changes,
          # cutting total build time by 1-2 minutes per run.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE_NAME }}:dev
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
