name: PR — Build & Stage

on:
  push:
    branches: [master]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository }}/vectorbee-backend
  IMAGE_UI: ghcr.io/${{ github.repository }}/vectorbee-ui

jobs:
  # ──────────────────────────────────────────────
  # 1. Backend — test + build fat JAR
  # ──────────────────────────────────────────────
  backend-test:
    name: Backend tests (Kotlin / JVM 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vectorbee-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          build-root-directory: vectorbee-backend

      - name: Run tests
        run: gradle test --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: vectorbee-backend/build/reports/tests/

      - name: Build distribution
        run: gradle installDist --no-daemon

  # ──────────────────────────────────────────────
  # 2. UI — lint + type-check + build
  # ──────────────────────────────────────────────
  ui-check:
    name: UI lint & type-check (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vectorbee-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vectorbee-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080

  # ──────────────────────────────────────────────
  # 3. E2E smoke test (Docker Compose)
  # ──────────────────────────────────────────────
  e2e:
    name: E2E smoke (Docker Compose)
    runs-on: ubuntu-latest
    needs: [backend-test, ui-check]
    env:
      VECTORBEE_API_KEY: vb_e2e_test_key_local
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose -f docker-compose.e2e.yml up -d --build --wait --no-deps db backend frontend
        timeout-minutes: 10

      - name: Smoke — list prompts
        run: |
          curl -sf \
            -H "Authorization: Bearer $VECTORBEE_API_KEY" \
            http://localhost:8080/api/prompts

      - name: Smoke — UI health
        run: curl -sf http://localhost:3000/

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v
