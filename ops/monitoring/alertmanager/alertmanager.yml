# Where alerts go, and — just as important — where they do NOT.
#
# Two things changed here from the version that never shipped.
#
# 1. IT HAS A CONFIGURED RECEIVER. The previous file carried three half-filled
#    options and an instruction to pick one, which nobody did. A receiver list that
#    was never completed is a config that silently drops every alert, and that is
#    what it did for the entire life of the stack.
#
# 2. IT KNOWS WHICH ENVIRONMENT AN ALERT CAME FROM. One monitoring stack now watches
#    both staging and production. Without the route below, a staging deploy that
#    kills workers pages someone at 3am for a fleet nobody is using. That happens
#    once before the alert is muted, and then the production one is muted too.
#
# ── THE ROUTING RULE, IN ONE SENTENCE ────────────────────────────────────────
# Only production pages. Everything else is a notification you read during the day.

global:
  resolve_timeout: 5m
  smtp_from: 'alerts@vectorbea.com'
  smtp_smarthost: '${SMTP_HOST}:587'
  smtp_auth_username: '${SMTP_USER}'
  smtp_auth_password: '${SMTP_PASSWORD}'

templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  receiver: tickets
  # Group by alert AND environment. Not by alertname alone: a lease-expiry storm in
  # staging and one in production are two incidents, and collapsing them into one
  # notification is how the production half gets missed.
  group_by: ['alertname', 'environment']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # ── Production pages ────────────────────────────────────────────────────
    # The only branch that is allowed to wake a person. Short repeat because these
    # describe conditions that persist until someone acts.
    - receiver: pages
      matchers:
        - severity = "page"
        - environment = "prod"
      group_wait: 15s
      repeat_interval: 2h
      continue: false

    # ── A page from anywhere else is a ticket ───────────────────────────────
    # Staging saturation is real information — it usually means a change is about to
    # do the same thing in production — but it is Monday information.
    - receiver: tickets
      matchers:
        - severity = "page"
      repeat_interval: 12h

    # ── Everything explicitly filed as a ticket ─────────────────────────────
    # 12h repeat, deliberately long. These persist until someone acts, and a 30-minute
    # reminder about a known problem is how an alert channel becomes background noise.
    - receiver: tickets
      matchers:
        - severity = "ticket"
      repeat_interval: 12h

receivers:
  # ── Pages: email plus a phone-capable webhook ───────────────────────────────
  #
  # Both, not either. Email alone does not wake anyone reliably, and a webhook alone
  # has no archive to read the next morning. If ALERT_WEBHOOK_URL is unset the webhook
  # is simply never delivered and the email still is — a missing optional channel must
  # not take the required one down with it.
  - name: pages
    email_configs:
      - to: '${ALERT_EMAIL}'
        send_resolved: true
        headers:
          Subject: '[PAGE][{{ .CommonLabels.environment }}] {{ .CommonAnnotations.summary }}'
        text: |
          {{ template "vectorbea.body" . }}

    webhook_configs:
      # ntfy.sh, a Telegram bot, or anything else that reaches a lock screen.
      # Free, and does not require a paid paging vendor at this size.
      - url: '${ALERT_WEBHOOK_URL}'
        send_resolved: true
        max_alerts: 5

  # ── Tickets: email only ─────────────────────────────────────────────────────
  - name: tickets
    email_configs:
      - to: '${ALERT_EMAIL}'
        send_resolved: true
        headers:
          Subject: '[{{ .CommonLabels.environment }}] {{ .CommonAnnotations.summary }}'
        text: |
          {{ template "vectorbea.body" . }}

inhibit_rules:
  # A dying fleet makes everything slow, so the saturation alert is redundant while
  # the lease-expiry alert is firing. Suppressing it keeps one incident to one page.
  - source_matchers: [alertname = "WorkersDyingOrOverloaded"]
    target_matchers: [alertname = "SystemSaturated"]
    equal: ['environment']

  # If an environment's agent is down, every other alert for that environment is
  # either stale or an artefact of the gap. ScrapeAgentDown is the one to act on;
  # the rest would send someone chasing a fleet problem that is really a collector
  # problem.
  - source_matchers: [alertname = "ScrapeAgentDown"]
    target_matchers: [severity =~ "page|ticket"]
    equal: ['environment']

  # A page and a ticket about the same condition is one condition.
  - source_matchers: [severity = "page"]
    target_matchers: [severity = "ticket"]
    equal: ['alertname', 'environment']
