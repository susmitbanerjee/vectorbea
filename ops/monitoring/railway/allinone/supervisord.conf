# Six programs, one container.
#
# ── WHY supervisord AND NOT A SHELL SCRIPT WITH `&` ──────────────────────────
# A script that backgrounds six processes and waits has two failure modes it cannot
# handle. It cannot restart one that dies without taking down the rest, and it cannot
# report WHICH one died — the container simply exits and Railway shows a restart with
# no explanation. supervisord restarts each program independently and names it in the
# log when it does.
#
# ── EVERY PROGRAM LOGS TO THE CONTAINER'S STDOUT ─────────────────────────────
# `stdout_logfile=/dev/fd/1` throughout, because Railway's log view IS the container's
# stdout. A program logging to a file inside the container is a program whose output
# nobody will ever read, and that is exactly the state you find yourself in at the
# moment something is wrong.
#
# ── WHAT ACTUALLY KEEPS THE INTERNAL SERVICES PRIVATE ────────────────────────
# Two things, and it is worth being precise about which does the work:
#
#  1. Railway routes exactly ONE port into the container — the one nginx listens on.
#     Nothing else is reachable from outside regardless of what it binds. This is the
#     real boundary.
#  2. nginx routes to exactly two upstreams (Grafana and the collector) and nothing
#     else. See nginx.conf.template.
#
# Prometheus, Alertmanager and Grafana are ADDITIONALLY pinned to 127.0.0.1 by flag,
# as defence in depth. Tempo, Loki and the collector are not: their listen addresses
# come from config files shared with docker-compose, where Grafana reaches them across
# a bridge network by service name and loopback would break it. That is a deliberate
# asymmetry, not an oversight — and it costs nothing, because of (1).

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

# Without these two sections `supervisorctl status` errors instead of answering — and
# that is the first command anyone runs when one component is misbehaving and the
# container as a whole looks fine. A unix socket, so it is reachable only from inside.
[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# ── Storage ─────────────────────────────────────────────────────────────────
# Every component writes under /data, which is where the Railway volume mounts. One
# volume, five subdirectories — created by the entrypoint before any of this starts.

[program:prometheus]
# Retention is bounded twice: by time because that is the policy, and by size because
# that is the safety net for a cardinality mistake. Without the second, a bad label
# fills the volume and takes the whole container with it — which now means the
# monitoring as well.
command=/usr/local/bin/prometheus
  --config.file=/etc/prometheus/prometheus.yml
  --storage.tsdb.path=/data/prometheus
  --storage.tsdb.retention.time=15d
  --storage.tsdb.retention.size=4GB
  --web.enable-remote-write-receiver
  --web.enable-lifecycle
  --web.listen-address=127.0.0.1:9090
autorestart=true
startsecs=5
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:alertmanager]
command=/usr/local/bin/alertmanager
  --config.file=/tmp/alertmanager.yml
  --storage.path=/data/alertmanager
  --web.listen-address=127.0.0.1:9093
autorestart=true
startsecs=5
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:tempo]
command=/usr/local/bin/tempo -config.file=/etc/tempo/tempo.yml
autorestart=true
startsecs=5
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:loki]
# Receives nothing on Railway today — Promtail reads a Docker socket that Railway does
# not expose. It runs anyway so the datasource resolves and the trace-to-logs links
# stay valid rather than erroring; it is unfed, not broken. See
# docs/telemetry/grafana-opentelemetry-setup.md.
command=/usr/local/bin/loki -config.file=/etc/loki/loki.yml
autorestart=true
startsecs=5
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:collector]
# Starts after Prometheus and Tempo: it writes to both, and starting first means a
# minute of retry noise on every deploy. It recovers either way — this is about the
# logs being readable, not about correctness.
command=/usr/local/bin/otelcol-contrib --config=/etc/otel/config.yml
autorestart=true
startsecs=5
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:grafana]
command=/run.sh
directory=/usr/share/grafana
autorestart=true
startsecs=5
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
# Last, and the only one listening on a routable address. If it dies the service is
# down from outside even though everything inside is healthy, so autorestart matters
# more here than anywhere else.
command=/usr/sbin/nginx -c /tmp/nginx.conf -g "daemon off;"
autorestart=true
startsecs=3
priority=40
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
