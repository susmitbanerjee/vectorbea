# The monitoring stack for the Hetzner box. All free, all self-hosted.
#
#   cd ops/monitoring && docker compose up -d
#
# WHY SELF-HOSTED
# ---------------
# §4.2 of the backend architecture is that the whole platform runs on a €6/month
# budget. A hosted APM would cost several times the entire infrastructure bill, and
# the per-host or per-series pricing models all punish exactly the thing this system
# does: many short spans and a metric labelled by workspace.
#
# The trade is real and worth stating: this stack is one box with no replication. If
# the box dies, the monitoring dies with it — including the monitoring that would have
# told you the box died. Uptime alerting therefore has to come from outside; a free
# external ping on the API's /health closes that gap and is NOT part of this file.
#
# SIZING
# ------
# Memory limits are set on every service because they share a box with nothing to
# spare, and an unbounded Prometheus will happily use everything. The limits below fit
# 4GB with room for the application; raise them together with the box, not one at a
# time.

name: vectorbea-monitoring

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # 15d, as specified. At the current series count this is well under a gigabyte;
      # the limit exists so a cardinality mistake fills a bounded volume instead of
      # the root filesystem, which would take the application down with it.
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.retention.size=4GB'
      # Matches the Railway deployment. The agent pushes; Prometheus no longer scrapes
      # the application. Without this the receive endpoint 404s and the agent retries
      # into a wall — which presents as "no data", not as an error.
      - '--web.enable-remote-write-receiver'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      # Bound to localhost. Prometheus has no authentication of its own and its
      # query API can read every metric, including per-workspace series. Reach it
      # through Grafana, or over an SSH tunnel.
      - "127.0.0.1:9091:9090"
    deploy:
      resources:
        limits:
          memory: 768M

  alertmanager:
    # BUILT, not pulled — and this is the one service where that matters. Alertmanager
    # does not expand environment variables in its config, so the ${SMTP_*} values have
    # to be substituted by an entrypoint before it starts. Running the stock image here
    # would mean the local stack silently used the literal string "${SMTP_PASSWORD}"
    # as a password while production used the real one, so local would never exercise
    # the delivery path at all. See ops/monitoring/railway/alertmanager.Dockerfile.
    build:
      context: ../..
      dockerfile: ops/monitoring/railway/alertmanager.Dockerfile
    restart: unless-stopped
    environment:
      ALERT_EMAIL: ${ALERT_EMAIL:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.resend.com}
      SMTP_USER: ${SMTP_USER:-resend}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    deploy:
      resources:
        limits:
          memory: 128M

  loki:
    image: grafana/loki:3.1.1
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    deploy:
      resources:
        limits:
          memory: 512M

  # Ships the JSON log lines the services write to stdout.
  #
  # Promtail reads Docker's container logs rather than requiring the services to push,
  # so a service that crashes on startup still has its logs collected — which is when
  # you most want them.
  promtail:
    image: grafana/promtail:3.1.1
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 128M

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yml"]
    environment:
      TELEMETRY_INGEST_TOKEN: ${TELEMETRY_INGEST_TOKEN:-local-dev-token}
      PROMETHEUS_REMOTE_WRITE_ENDPOINT: http://prometheus:9090/api/v1/write
      TEMPO_ENDPOINT: tempo:4317
      # Where the OTLP/HTTP receiver binds. Explicit because the collector config
      # deliberately carries no default — see the note in otel/config.yml.
      OTLP_HTTP_PORT: "4318"
    volumes:
      - ./otel/config.yml:/etc/otel/config.yml:ro
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC — what the services export to
      - "127.0.0.1:4318:4318"   # OTLP HTTP
    deploy:
      resources:
        limits:
          memory: 256M

  tempo:
    image: grafana/tempo:2.6.0
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
    deploy:
      resources:
        limits:
          memory: 512M

  grafana:
    # BUILT, not pulled — the access allow-list lives in the entrypoint, and running
    # the stock image locally would mean the auth path that ships is the one path
    # nobody ever exercises.
    build:
      context: ../..
      dockerfile: ops/monitoring/railway/grafana.Dockerfile
    restart: unless-stopped
    environment:
      # No anonymous access. The dashboards show per-workspace cost and volume, which
      # is customer data even though it is aggregate.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"

      # ── Who may open this at all ────────────────────────────────────────────
      # The container refuses to start without it. Locally, OAuth is normally not
      # configured, so this has no effect beyond being present — but it is set here
      # so the local file documents the production requirement rather than hiding it.
      GRAFANA_ALLOWED_EMAILS: ${GRAFANA_ALLOWED_EMAILS:-susmit.b1@gmail.com}
      # Unset locally: no OAuth, local admin login, and a loud warning at startup.
      # Set on Railway, where a shared password would not be an identity.
      GRAFANA_OAUTH_CLIENT_ID: ${GRAFANA_OAUTH_CLIENT_ID:-}
      GRAFANA_OAUTH_CLIENT_SECRET: ${GRAFANA_OAUTH_CLIENT_SECRET:-}
      GRAFANA_BREAK_GLASS: ${GRAFANA_BREAK_GLASS:-false}
      # Must match the public URL or every generated link — including the one in an
      # alert email — points at localhost.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      # Service names here; the all-in-one container sets these to loopback. Same
      # datasources.yml either way.
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      TEMPO_URL: http://tempo:3200
      # The Product and Workspace-support dashboards read analytics_events directly.
      # This MUST be a read-only role: Grafana accepts arbitrary SQL from anyone who
      # can edit a panel. See ops/monitoring/railway/README.md §6.
      ANALYTICS_DB_HOST: ${ANALYTICS_DB_HOST:-host.docker.internal}
      ANALYTICS_DB_PORT: ${ANALYTICS_DB_PORT:-5432}
      ANALYTICS_DB_NAME: ${ANALYTICS_DB_NAME:-vectorbea}
      ANALYTICS_DB_USER: ${ANALYTICS_DB_USER:-grafana_ro}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:-}
      # Dashboards and datasources are provisioned from this repo, not clicked
      # together in the UI. A dashboard that exists only in Grafana's database is one
      # box failure away from being gone, and is not reviewable.
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    deploy:
      resources:
        limits:
          memory: 512M

  # ── The per-environment agent, locally ──────────────────────────────────────
  #
  # Present so local development exercises the SAME path production uses. Without it
  # the local stack would be the only place Prometheus scrapes services directly, and
  # the config that actually ships would have no local coverage at all — which is how
  # the previous version of this stack came to be untested.
  #
  # `host.docker.internal` is correct HERE and only here: locally the services really
  # are on the host. On Railway the agent uses DNS discovery inside the private network.
  telemetry-agent:
    image: otel/opentelemetry-collector-contrib:0.109.0
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yml"]
    environment:
      VECTORBEA_ENV: ${VECTORBEA_ENV:-local}
      TELEMETRY_INGEST_TOKEN: ${TELEMETRY_INGEST_TOKEN:-local-dev-token}
      TELEMETRY_INGEST_ENDPOINT: http://otel-collector:4318
      API_METRICS_TARGET: host.docker.internal:8080
      WORKER_DNS_NAME: host.docker.internal
    volumes:
      - ./agent/config.local.yml:/etc/otel/config.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - otel-collector
    ports:
      - "127.0.0.1:4319:4317"   # where local api/worker send spans
    deploy:
      resources:
        limits:
          memory: 192M

volumes:
  prometheus-data:
  alertmanager-data:
  loki-data:
  tempo-data:
  grafana-data:
