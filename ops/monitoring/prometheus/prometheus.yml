# Central Prometheus. Receives; barely scrapes.
#
# ── WHAT CHANGED, AND WHY IT HAD TO ──────────────────────────────────────────
# This file used to scrape `host.docker.internal:8080` and three hard-coded worker
# ports. That works on exactly one topology — every process on one box — and the
# platform does not run on one box; it runs on Railway, where the API and the worker
# live in per-environment private networks this process cannot reach.
#
# The result was a scrape config that had never successfully scraped anything, three
# dashboards rendering nothing, and 110 metrics emitted into the void. See
# docs/TELEMETRY-AUDIT.md §8.
#
# So the direction is inverted: a per-environment agent scrapes inside its own
# network and pushes here (ops/monitoring/agent/config.yml). This process receives
# remote-write from the central collector and scrapes only the monitoring stack
# itself, which IS on its own private network and IS reachable.
#
# Requires `--web.enable-remote-write-receiver` — set in docker-compose.yml. Without
# it the receive endpoint 404s and every agent retries into a wall.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    # Identifies THIS MONITORING STACK, not the environment being monitored. The
    # `environment` label on application series is stamped by the agent that
    # collected it — see the agent config for why it is set there and not here.
    #
    # Note that external_labels are applied to remote-READ and federation, not to
    # received remote-write, which is what makes it safe for this to differ from the
    # `environment` label the series already carry.
    monitor: 'vectorbea-central'

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # ── Self-monitoring only ────────────────────────────────────────────────────
  #
  # Application targets are NOT here. They arrive by remote-write. The one thing
  # this stack can still scrape directly is itself, and it should: a Prometheus that
  # cannot see its own ingestion rate cannot tell "no traffic" from "not receiving",
  # and those look identical on a dashboard and mean opposite things.
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: prometheus
          environment: infra

  # The central collector's own telemetry — queue depth, refused spans, export
  # failures. When ingest breaks, this is the series that says so.
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']
        labels:
          service: otel-collector
          environment: infra
