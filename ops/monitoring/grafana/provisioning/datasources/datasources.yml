apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    # Env-driven so ONE provisioning file serves both topologies: service names on
    # a bridge network under docker-compose, loopback in the all-in-one container.
    url: ${PROMETHEUS_URL}
    isDefault: true
    jsonData:
      timeInterval: 15s

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: ${LOKI_URL}
    jsonData:
      # Turns a `trace_id` in a log line into a link to the trace.
      #
      # This is the single most useful thing in the whole stack, and it exists only
      # because `trace_id` is in the log envelope. Following a spike on a dashboard to
      # the logs, then to the trace, then to the slow span, without typing an
      # identifier by hand, is the difference between five minutes and an hour.
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id":"(\w+)"'
          url: '$${__value.raw}'
          datasourceUid: tempo

  # ── The application database, READ ONLY ────────────────────────────────────
  #
  # WHY A SECOND KIND OF DATASOURCE AT ALL
  # The technical dashboards read Prometheus. The product ones cannot: adoption,
  # funnels and feature usage come from discrete events in `analytics_events`, and
  # those are not metrics. Turning them into Prometheus series would mean a counter
  # per event name per workspace — a cardinality disaster to answer questions that
  # SQL answers exactly, over data that is already being written.
  #
  # It is also what makes the product dashboards environment-aware for free:
  # `analytics_events.environment` has been a first-class column since V032, so the
  # same `$env` selector works here as on the metric dashboards.
  #
  # ONE DATASOURCE PER ENVIRONMENT, because each environment has its own database.
  # `analytics_events.environment` alone cannot separate them: the staging API writes
  # into the staging database and production into production, so a single connection
  # only ever sees one of them. The dashboards pick the connection from `$env` through
  # a hidden datasource variable matching the NAME "Analytics <env>" — so the names
  # below are load-bearing, and must equal the `environment` values (`prod`, `dev`).
  #
  # Every query still filters `environment = '$env'`. That is the guard against a
  # connection pointed at the wrong database: it shows empty panels, never another
  # environment's numbers under this one's name.
  #
  # THE CREDENTIAL MUST BE A READ-ONLY ROLE, in EACH database. Not the application
  # user. Grafana dashboards accept arbitrary SQL from anyone who can edit a panel,
  # and a connection with write access turns "someone experimented with a query" into
  # a production incident. See ops/monitoring/railway/README.md §6 for the GRANT.
  #
  # Port and sslmode defaults are exported by the entrypoint (Grafana's provisioning
  # has no `${VAR:-default}`).
  - name: Analytics prod
    type: postgres
    uid: analytics-prod
    access: proxy
    url: ${ANALYTICS_PROD_DB_HOST}:${ANALYTICS_PROD_DB_PORT}
    database: ${ANALYTICS_PROD_DB_NAME}
    user: ${ANALYTICS_PROD_DB_USER}
    secureJsonData:
      password: ${ANALYTICS_PROD_DB_PASSWORD}
    jsonData:
      sslmode: ${ANALYTICS_PROD_DB_SSLMODE}
      postgresVersion: 1600
      # Neon pools aggressively on its side; a large Grafana-side pool on top of it
      # is how a dashboard refresh starves the application of connections.
      maxOpenConns: 4
      maxIdleConns: 2
      timescaledb: false

  - name: Analytics dev
    type: postgres
    uid: analytics-dev
    access: proxy
    url: ${ANALYTICS_DEV_DB_HOST}:${ANALYTICS_DEV_DB_PORT}
    database: ${ANALYTICS_DEV_DB_NAME}
    user: ${ANALYTICS_DEV_DB_USER}
    secureJsonData:
      password: ${ANALYTICS_DEV_DB_PASSWORD}
    jsonData:
      sslmode: ${ANALYTICS_DEV_DB_SSLMODE}
      postgresVersion: 1600
      maxOpenConns: 4
      maxIdleConns: 2
      timescaledb: false

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: ${TEMPO_URL}
    jsonData:
      # And the reverse direction: from a span to the logs emitted inside it.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-2m'
        spanEndTimeShift: '2m'
        filterByTraceID: true
        tags:
          - key: 'service.name'
            value: 'service'
