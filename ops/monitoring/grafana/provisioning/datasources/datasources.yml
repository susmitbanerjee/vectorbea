apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # Turns a `trace_id` in a log line into a link to the trace.
      #
      # This is the single most useful thing in the whole stack, and it exists only
      # because `trace_id` is in the log envelope. Following a spike on a dashboard to
      # the logs, then to the trace, then to the slow span, without typing an
      # identifier by hand, is the difference between five minutes and an hour.
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id":"(\w+)"'
          url: '$${__value.raw}'
          datasourceUid: tempo

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # And the reverse direction: from a span to the logs emitted inside it.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-2m'
        spanEndTimeShift: '2m'
        filterByTraceID: true
        tags:
          - key: 'service.name'
            value: 'service'
