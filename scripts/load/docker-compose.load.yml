# Isolated Postgres + Redis for the load harness.
#
# Deliberately on non-default ports (15432 / 16379) and named volumes so a load
# run cannot touch a developer's local dev database. `resetLoadData` only ever
# deletes rows under workspaces slugged `loadtest-*`, but the port separation is
# the real guarantee.
#
#   docker compose -f scripts/load/docker-compose.load.yml up -d
#   docker compose -f scripts/load/docker-compose.load.yml down -v

name: vectorbea-load

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vectorbea
      POSTGRES_PASSWORD: vectorbea
      POSTGRES_DB: vectorbea
    ports:
      - "15432:5432"
    # tmpfs: the harness truncates between scenarios and nothing here is worth
    # keeping, so trade durability for speed and leave no disk residue.
    tmpfs:
      - /var/lib/postgresql/data
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      - -c
      - max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vectorbea -d vectorbea"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no --loglevel warning
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
